<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Assistant</title>

    <link rel="stylesheet" href="/static/chatbot/chatbot.css">

</head>

<body>

<div class="container">

    <h2>Assistant</h2>

    <div id="chat"></div>

    <div class="input-row">
        <div id="limit-message" style="display:none; color:red; font-size:0.85em; margin-top:4px;">
            Limit of 100 characters reached
        </div>
        <input
            id="message"
            placeholder="Type your message..."
            maxlength="100"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script src="static/chatbot/chatbot.js"></script>

</body>

</html>
