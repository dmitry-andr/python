<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ph_land</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Welcome to ph_land</h1>
        <p>A simple FastAPI landing page with REST endpoints.</p>
      </header>

      <section>
        <h2>Getting started</h2>
        <p>Use the REST API endpoints under <code>/api</code>.</p>
        <ul>
          <li><code>GET /api/health</code></li>
          <li><code>GET /api/items</code></li>
          <li><code>GET /api/items/{item_id}</code></li>
          <li><code>POST /api/items</code></li>
          <li><code>PUT /api/items/{item_id}</code></li>
          <li><code>DELETE /api/items/{item_id}</code></li>
          <li><a href="/chatbot.html">Go to Chatbot</a></li>
        </ul>
      </section>
    </div>
  </body>
</html>
