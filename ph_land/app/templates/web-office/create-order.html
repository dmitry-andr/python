<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Order</title>
    <link rel="stylesheet" href="/static/web-office/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Create Order</h1>
      <p class="lead">Fill out the fields below to create a new Order.</p>
      <p class="meta">Path: /web-office/create-order.html</p>

      <form class="order-form" action="/web-office/create-order" method="post">
        <label for="customer_id">Customer</label>
        <select id="customer_id" name="customer_id" required>
          <option value="">Select a customer</option>
          {% for customer in customers %}
          <option value="{{ customer.id }}">{{ customer.first_name }} {{ customer.last_name }}</option>
          {% endfor %}
        </select>

        <label for="service_id">Service</label>
        <select id="service_id" name="service_id" required>
          <option value="">Select a service</option>
          {% for service in services %}
          <option value="{{ service.id }}">{{ service.name }}</option>
          {% endfor %}
        </select>

        <label for="provider_id">Provider ID</label>
        <input id="provider_id" name="provider_id" type="text" required>
   
        <label for="start_time">Start Time</label>
        <input id="start_time" name="start_time" type="datetime-local" required>

        <label for="end_time">End Time</label>
        <input id="end_time" name="end_time" type="datetime-local" required>
        
        <label for="details">Details</label>
        <textarea id="details" name="details" rows="4" placeholder="Enter order details"></textarea>

        <div class="button-row">
          <button class="button primary" type="submit">Save</button>
          <button class="button secondary" type="button" onclick="window.location.href='/web-office/web-office.html'">Cancel</button>
        </div>
      </form>
    </div>
  </body>
</html>
