<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Service</title>
    <link rel="stylesheet" href="/static/web-office/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Create Service</h1>
      <p class="lead">Fill in the fields below to create a new Service object.</p>
      <p class="meta">Path: /web-office/create-service.html</p>

      <form class="service-form" action="/web-office/create-service" method="post">
        <label for="business_id">Business ID</label>
        <input id="business_id" name="business_id" type="text" required>

        <label for="service_type">Service Type</label>
        <input id="service_type" name="service_type" type="text" required>

        <label for="service_sub_type">Service Sub-Type</label>
        <input id="service_sub_type" name="service_sub_type" type="text" required>

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" required></textarea>

        <div class="button-row">
          <button class="button primary" type="submit">Save</button>
          <button class="button secondary" type="button" onclick="window.location.href='/web-office/web-office.html'">Cancel</button>
        </div>
      </form>
    </div>
  </body>
</html>
