<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Customer</title>
    <link rel="stylesheet" href="/static/web-office/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Create Customer</h1>
      <p class="lead">Enter customer details to create a new customer record.</p>

      <form class="service-form" action="/web-office/create-customer" method="post">
        <label for="first_name">First Name</label>
        <input id="first_name" name="first_name" type="text" required>

        <label for="last_name">Last Name</label>
        <input id="last_name" name="last_name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email">

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel">

        <div class="button-row">
          <button class="button primary" type="submit">Save</button>
          <button class="button secondary" type="button" onclick="window.location.href='/web-office/web-office.html'">Cancel</button>
        </div>
      </form>
    </div>
  </body>
</html>
